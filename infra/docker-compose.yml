services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: interview-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interview_copilot
      POSTGRES_PASSWORD: interview_copilot_dev
      POSTGRES_DB: interview_copilot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - interview-copilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interview-copilot-pgdata:
